[project]
name = "scale-mcp-server"
version = "1.0.0"
description = "IBM Storage Scale MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
 "fastmcp>=3.1.0",
 "paramiko>=4.0.0",
]

[tool.uv]
constraint-dependencies = [
  # CVE-2026-63374 / GHSA-82r6-8w77-94w6: AnyIO TLSStream IDNA 2003 host name encoding (fixed in 4.14.2)
  "anyio>=4.14.2",
  # CVE: Bleichenbacher oracle in PKCS#7 EnvelopedData decryption (fixed in 50.0.0)
  "cryptography>=50.0.0",
  # CVE: WebSocket Host/Origin bypass + HTTP session auth bypass (fixed in 1.28.1)
  "mcp>=1.28.1",
]

[build-system]
requires = ["uv_build>=0.10.0"]
build-backend = "uv_build"

[project.scripts]
scale-mcp-server = "scale_mcp_server:main"
